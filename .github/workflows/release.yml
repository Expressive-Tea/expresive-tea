# Automated release workflow for Expressive Tea
# Publishes package to npm and creates GitHub releases when version tags are pushed
#
# Usage: Push a tag like v2.0.0 to trigger a release

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: 🔍 Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.get-version.outputs.version }}
      is-prerelease: ${{ steps.check-prerelease.outputs.is-prerelease }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Get version from tag
        id: get-version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Releasing version: $VERSION"

      - name: 🔍 Check if prerelease
        id: check-prerelease
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "⚠️ This is a prerelease version"
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
            echo "✅ This is a stable release"
          fi

      - name: 🔧 Enable Corepack
        run: corepack enable

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🧪 Run tests
        run: yarn test

      - name: 🏗️ Build
        run: yarn build

  publish-npm:
    name: 📦 Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Enable Corepack
        run: corepack enable

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🏗️ Build package
        run: yarn build

      - name: 📋 Verify package contents
        run: |
          echo "📦 Package contents:"
          npm pack --dry-run

      - name: 🚀 Publish to npm (stable)
        if: needs.validate.outputs.is-prerelease == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🚀 Publish to npm (prerelease)
        if: needs.validate.outputs.is-prerelease == 'true'
        run: npm publish --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: ✅ Published successfully
        run: |
          echo "✅ Published @expressive-tea/core@${{ needs.validate.outputs.version }}"
          echo "📦 View on npm: https://www.npmjs.com/package/@expressive-tea/core"

  create-github-release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish-npm]
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate release notes
        id: release-notes
        run: |
          # Extract changelog for this version from CHANGELOG.md
          VERSION=${{ needs.validate.outputs.version }}
          echo "Extracting changelog for version $VERSION"
          
          # Create release notes file
          cat > release-notes.md << 'EOF'
          ## 🎉 Release v${{ needs.validate.outputs.version }}

          **Published:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Package:** [@expressive-tea/core](https://www.npmjs.com/package/@expressive-tea/core)

          ---

          ### 📦 Installation

          \`\`\`bash
          npm install @expressive-tea/core@${{ needs.validate.outputs.version }}
          # or
          yarn add @expressive-tea/core@${{ needs.validate.outputs.version }}
          \`\`\`

          ---

          ### 📋 Changelog

          For detailed changes, see [CHANGELOG.md](https://github.com/Expressive-Tea/expresive-tea/blob/develop/CHANGELOG.md).

          ---

          ### 🔗 Resources

          - [Documentation](https://expressive-tea.io/docs)
          - [Migration Guide](https://github.com/Expressive-Tea/expresive-tea/blob/develop/MIGRATION_GUIDE_v2.md)
          - [npm Package](https://www.npmjs.com/package/@expressive-tea/core)

          EOF

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.validate.outputs.is-prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Release created
        run: |
          echo "✅ GitHub release created successfully"
          echo "🔗 View release: https://github.com/Expressive-Tea/expresive-tea/releases/tag/v${{ needs.validate.outputs.version }}"

  notify:
    name: 📢 Notify Release
    runs-on: ubuntu-latest
    needs: [validate, publish-npm, create-github-release]
    if: success()
    timeout-minutes: 5

    steps:
      - name: 📢 Release notification
        run: |
          echo "🎉 Successfully released @expressive-tea/core@${{ needs.validate.outputs.version }}"
          echo "📦 npm: https://www.npmjs.com/package/@expressive-tea/core"
          echo "🔗 GitHub: https://github.com/Expressive-Tea/expresive-tea/releases/tag/v${{ needs.validate.outputs.version }}"
          
      # Add additional notification steps here (Discord, Slack, Twitter, etc.)
      # Example:
      # - name: 📢 Notify Discord
      #   uses: sarisia/actions-status-discord@v1
      #   with:
      #     webhook: ${{ secrets.DISCORD_WEBHOOK }}
      #     title: "🎉 New Release: v${{ needs.validate.outputs.version }}"
